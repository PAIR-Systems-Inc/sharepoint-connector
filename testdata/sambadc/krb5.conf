# Client-side Kerberos config for the Samba AD DC test fixture.
#
# The KDC is pinned by address rather than discovered: Kerberos normally finds it
# through _kerberos._tcp SRV records, which would require pointing this host's
# resolver at the container. Pinning keeps the fixture self-contained.
[libdefaults]
    default_realm = CORP.EXAMPLE.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    udp_preference_limit = 0

[realms]
    CORP.EXAMPLE.TEST = {
        kdc = 172.28.0.10
        admin_server = 172.28.0.10
    }

[domain_realm]
    .corp.example.test = CORP.EXAMPLE.TEST
    corp.example.test = CORP.EXAMPLE.TEST
