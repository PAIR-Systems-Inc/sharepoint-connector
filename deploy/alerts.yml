# Recommended Prometheus alerting rules for the Goodmem connector listener.
#
# These key on the series exposed at GET /metrics. Several connector failure
# modes are otherwise silent for up to ~GRAPH_FULL_SYNC_MINUTES, so wire at least
# the "warning"/"critical" rules into Alertmanager. Thresholds are starting
# points — tune to your tenant's volume and your GRAPH_* settings.
#
# Source-agnostic: every series is connector_* with a source="<provider>" label
# ("sharepoint", "google-drive"), so these rules cover any provider, and alerts
# carry {{ $labels.source }} to say which connector fired. Running two connectors
# scraped into the same Prometheus needs no rule changes.
#
# Load into Prometheus via rule_files: [ alerts.yml ]. Assumes the listener is a
# scrape target; `job`/`instance` labels come from your scrape_config.
groups:
  - name: goodmem-connector
    rules:
      # The listener is down or unscrapeable. `up` is synthesized by Prometheus
      # per target; connector_up is emitted by the process itself.
      - alert: ConnectorListenerDown
        expr: up{job="goodmem-connector"} == 0 or connector_up == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Connector listener is down ({{ $labels.source }})"
          description: "No successful scrape / connector_up==0 for 5m — the {{ $labels.source }} connector is not syncing."

      # A file has been parked after exhausting its retries (oversized, corrupt,
      # or Goodmem always marks it FAILED). It will never sync without action.
      - alert: ConnectorDeadLetter
        expr: connector_pending_dead > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Connector has parked (dead-lettered) files ({{ $labels.source }})"
          description: "{{ $value }} file(s) parked after exhausting retries. Inspect GET /syncs?status=dead."

      # Subscription renewal is failing (push mode). Two consecutive failures let
      # the subscription lapse and notifications stop silently.
      - alert: ConnectorSubscriptionRenewalFailing
        expr: increase(connector_subscription_renewal_failures_total[2h]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Connector subscription renewal failing ({{ $labels.source }})"
          description: "Renewal(s) failed in the last 2h — the change subscription may lapse and stop delivering notifications."

      # Retries are accumulating and not draining — a systemic ingest problem.
      - alert: ConnectorRetryBacklog
        expr: (connector_pending_add + connector_pending_update + connector_pending_remove) > 50
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Connector retry backlog not draining ({{ $labels.source }})"
          description: "{{ $value }} items pending retry for 30m — Goodmem or the source API may be persistently failing."

      # Per-item sync errors are occurring.
      - alert: ConnectorSyncErrors
        expr: increase(connector_sync_errors_total[1h]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Connector sync errors ({{ $labels.source }})"
          description: "{{ $value }} per-item sync error(s) in the last hour. Check GET /syncs?status=failure."

      # Sustained throttling by the source API — approaching rate limits.
      - alert: ConnectorThrottleStorm
        expr: increase(connector_throttle_events_total[15m]) > 20
        for: 5m
        labels: { severity: info }
        annotations:
          summary: "Connector is being throttled by the source API ({{ $labels.source }})"
          description: "{{ $value }} throttle/backoff events in 15m — the provider is rate-limiting; syncs will be slow."

      # No sync has happened in a long time. IMPORTANT: set the threshold ABOVE
      # your GRAPH_FULL_SYNC_MINUTES (the periodic reconcile updates last_sync),
      # or a quiet source will false-alarm. Example below assumes the ~36h default;
      # raise it if you lengthen GRAPH_FULL_SYNC_MINUTES.
      - alert: ConnectorSyncStale
        expr: time() - connector_last_sync_timestamp_seconds > 172800  # 48h
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Connector has not synced recently ({{ $labels.source }})"
          description: "No full/delta sync for >48h — even the periodic reconcile hasn't run. Check the listener."
