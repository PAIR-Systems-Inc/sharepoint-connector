<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="14" role="img">
  <title>Goodmem connector sync modes: manual/periodic (connector sync-once) and event-triggered (connector serve listener, triggered by a push webhook or a poll timer), for either source — SharePoint or Google Drive. Monitoring and Fly.io deployment are optional.</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="barrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- ============ Panel 1: Manual / periodic sync ============ -->
  <text x="30" y="28" font-weight="600" font-size="15" fill="#0f172a">Manual / periodic sync</text>
  <text x="30" y="45" fill="#64748b" font-size="11">one shot: list everything, diff against Goodmem, ingest what changed</text>

  <rect x="30" y="58" width="124" height="46" rx="8" fill="#eef2ff" stroke="#475569"/>
  <text x="92" y="78" text-anchor="middle" font-size="12">SharePoint</text>
  <text x="92" y="95" text-anchor="middle" font-size="12">or Google Drive</text>

  <rect x="250" y="58" width="176" height="46" rx="8" fill="#fff7ed" stroke="#475569"/>
  <text x="338" y="86" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">connector sync-once</text>

  <rect x="522" y="58" width="88" height="46" rx="8" fill="#ecfdf5" stroke="#475569"/>
  <text x="566" y="86" text-anchor="middle">Goodmem</text>

  <line x1="156" y1="81" x2="248" y2="81" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="202" y="71" text-anchor="middle" fill="#64748b" font-size="11">list all files</text>

  <line x1="428" y1="81" x2="520" y2="81" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="474" y="71" text-anchor="middle" fill="#64748b" font-size="11">ingest</text>

  <line x1="30" y1="124" x2="610" y2="124" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ============ Panel 2: Event-triggered sync ============ -->
  <text x="30" y="150" font-weight="600" font-size="15" fill="#0f172a">Event-triggered sync</text>
  <text x="30" y="167" fill="#64748b" font-size="11">trigger: push webhook (SharePoint default) or poll timer (Google Drive default)</text>

  <rect x="30" y="180" width="124" height="58" rx="8" fill="#eef2ff" stroke="#475569"/>
  <text x="92" y="204" text-anchor="middle" font-size="12">SharePoint</text>
  <text x="92" y="221" text-anchor="middle" font-size="12">or Google Drive</text>

  <rect x="238" y="180" width="200" height="58" rx="8" fill="#fff7ed" stroke="#475569"/>
  <text x="338" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">connector serve</text>
  <text x="338" y="216" text-anchor="middle" fill="#64748b" font-size="10">webhook (push) or timer (poll)</text>
  <text x="338" y="229" text-anchor="middle" fill="#94a3b8" font-size="10">public HTTPS only in push mode</text>

  <rect x="522" y="180" width="88" height="58" rx="8" fill="#ecfdf5" stroke="#475569"/>
  <text x="566" y="213" text-anchor="middle">Goodmem</text>

  <!-- 1 · inbound webhook: push mode only (in poll mode the listener wakes itself) -->
  <line x1="156" y1="200" x2="236" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="196" y="192" text-anchor="middle" fill="#64748b" font-size="11">1 · webhook</text>

  <!-- 2 · the listener reads the source: a delta, or a full list on reconcile -->
  <line x1="236" y1="216" x2="156" y2="216" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="230" text-anchor="middle" fill="#64748b" font-size="11">2 · pull</text>
  <text x="196" y="252" text-anchor="middle" fill="#64748b" font-size="10">delta / full list</text>

  <line x1="440" y1="209" x2="520" y2="209" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="200" text-anchor="middle" fill="#64748b" font-size="11">3 · apply</text>

  <!-- ============ Optional side-cars ============ -->
  <rect x="30" y="284" width="250" height="62" rx="8" fill="#eef2ff" stroke="#475569" stroke-dasharray="6 4"/>
  <text x="155" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Monitoring (optional)</text>
  <text x="155" y="320" text-anchor="middle" fill="#64748b" font-size="10">Prometheus scrapes /metrics</text>
  <text x="155" y="334" text-anchor="middle" fill="#64748b" font-size="10">connector watch tails /activity</text>

  <rect x="360" y="284" width="250" height="62" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-dasharray="6 4"/>
  <text x="485" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Deploy (one option)</text>
  <text x="485" y="320" text-anchor="middle" fill="#1e3a8a" font-size="10">./deploy_fly_io.sh — any host works</text>
  <text x="485" y="334" text-anchor="middle" fill="#1e3a8a" font-size="10">--hands-free also deploys Goodmem</text>

  <line x1="270" y1="282" x2="320" y2="240" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="268" text-anchor="middle" fill="#64748b" font-size="10">GET /metrics · /syncs · /activity</text>

  <line x1="395" y1="282" x2="372" y2="240" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#barrow)"/>
  <text x="462" y="268" text-anchor="middle" fill="#1d4ed8" font-size="10">deploys the listener</text>

  <text x="30" y="364" fill="#94a3b8" font-size="10">Pull = delta since the saved cursor. Full list at startup, on the periodic reconcile, or on cursor expiry.</text>
</svg>
